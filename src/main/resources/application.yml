server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/History
    username: myuser
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  session:
    jdbc:
      initialize-schema: always

logging:
  level:
    org.flywaydb: info