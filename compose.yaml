services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=History'
      - 'MYSQL_USER=myuser'
      - 'MYSQL_PASSWORD='
      - 'MYSQL_ROOT_PASSWORD='
    ports:
      - '3307:3306'

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - '8081:80'
    environment:
      - 'PMA_HOST=mysql'
      - 'PMA_PORT=3306'